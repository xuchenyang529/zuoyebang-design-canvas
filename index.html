<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业帮 · 智能设计画布</title><body style="font:14px system-ui;color:#65748c;padding:40px">正在加载设计工作台…<script>(async()=>{try{const [base,code,css]=await Promise.all(['baseline.html','app-v4.js','styles-v4.css'].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p);return r.text()}));const urls=[...base.matchAll(/src:'(data:[^']+)'/g)].slice(0,9).map(m=>m[1]);const names=['product-front.png','product-screen.png','product-detail.png','model-a.jpg','model-b.jpg','ref-p5.jpg','ref-xnote.jpg','ref-study.jpg','brand.png'];if(urls.length!==9)throw Error('assets');let app=code;names.forEach((n,i)=>app=app.split('assets/learning/'+n).join(urls[i]));const icon=base.match(/class="brand" src="(data:[^"]+)"/);app=app.split('assets/learning/brand-icon.png').join(icon?icon[1]:urls[8]);let html=base.replace(/<style>[\s\S]*?<\/style>/,()=>'<style>'+css+'</style>');const at=html.lastIndexOf('<script>');html=html.slice(0,at)+'<script>'+app+'<\/script></body></html>';document.open();document.write(html);document.close()}catch(e){document.body.textContent='页面加载失败，请刷新重试。'}})();</script></body></html>
